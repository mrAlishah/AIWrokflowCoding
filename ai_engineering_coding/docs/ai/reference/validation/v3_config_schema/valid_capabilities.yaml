version: 3
capabilities:
  test:
    providers:
      - provider_type: local_tool
        identifier: repository_tests
        availability: configured
        authority: repository
        deterministic: true
        command: test-command
        network_requirement: none
      - provider_type: local_tool
        identifier: alternate_tests
        availability: configured
        authority: repository
        deterministic: true
        command: alternate-test-command
        network_requirement: none
  security_scan:
    providers:
      - provider_type: external_tool
        identifier: configured_scanner
        availability: detected
        authority: repository
        deterministic: true
        tool_reference: security_scanner
        network_requirement: required
