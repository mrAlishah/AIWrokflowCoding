invocation_cases:
  - id: invalid_explicit_type_on_canonical_runtime_path
    fixture: valid_minimal_runtime.yaml
    inferred_path: config/runtime_config.yaml
    requested_type: unknown_type
    expected_exit_code: 2
    expected_code: CFG_INVALID_INVOCATION
    expect_json: true
  - id: ambiguous_document_type_json
    fixture: valid_minimal_runtime.yaml
    inferred_path: reference/validation/v3_config_schema/valid_minimal_runtime.yaml
    expected_exit_code: 2
    expected_code: CFG_INVALID_INVOCATION
    expect_json: true
